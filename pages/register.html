<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAM! - Sign Up</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <!-- NAVIGATION BAR -->
    <nav>
        <div>
            <a href="../index.html">Home</a>
            <a href="game.html">Play Game</a>
            <a href="leaderboard.html">Leaderboard</a>
        </div>
        <div class="nav-auth">
            <a href="login.html" id="login-btn">Log In</a>
            <a href="register.html" id="register-btn">Sign Up</a>
        </div>
    </nav>

    <!-- REGISTRATION -->
    <main class="auth flex-center">
        <div>
            <h1>Register</h1>
            <div class="form">
                <!-- Name -->
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="John Doe">
                <p id="name-error"></p>

                <!-- Username -->
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="johndoe123">
                <p id="username-error"></p>

                <!-- Email -->
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john@example.com">
                <p id="email-error"></p>

                <!-- Password -->
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min. 8 chararacters">
                <p id="password-error"></p>
                <button class="btn" id="submit-btn">Sign Up</button>
            </div>
            <p>Already have an account? <a href="login.html">Log In.</a></p>
            <p id="result"></p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div>
            <p><b>ACCOUNT</b></p>
            <ul>
                <li><a href="login.html">Log In</a></li>
                <li><a href="register.html">Sign Up</a></li>
            </ul>
        </div>
        <div>
            <p><b>GAME</b></p>
            <ul>
                <li><a href="game.html">Play</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="index.html#how-to-play">How to Play</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
        </div>
        <div>
            <p><b>COMPANY</b></p>
            <p>&copy; 2026 WAM!. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth/registration.js"></script>
</body>

</html>
