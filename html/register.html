<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - WAM!</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <!-- NAVIGATION BAR -->
    <nav>
        <div>
            <a href="index.html">Home</a>
            <a href="game.html">Play Game</a>
            <a href="leaderboard.html">Leaderboard</a>
        </div>
        <div class="nav-right">
            <a href="login.html">Log In</a>
            <a href="register.html">Sign Up</a>
        </div>
    </nav>

    <!-- REGISTRATION -->
    <main class="registration flex-center">
        <div>
            <h1>Register</h1>
            <div class="form">
                <input type="text" id="name" placeholder="Enter Name">
                <p id="name-error"></p>
                <input type="text" id="username" placeholder="Enter Username">
                <p id="username-error"></p>
                <input type="email" id="email" placeholder="Enter Email">
                <p id="email-error"></p>
                <input type="password" id="password" placeholder="Enter Password">
                <p id="password-error"></p>
                <button class="btn" onclick="register.validate()">Sign Up</button>
            </div>
            <p>Already have an account? <a href="login.html">Log In.</a></p>
            <p id="result"></p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div>
            <p><b>ACCOUNT</b></p>
            <ul>
                <li><a href="login.html">Log In</a></li>
                <li><a href="register.html">Sign Up</a></li>
            </ul>
        </div>
        <div>
            <p><b>GAME</b></p>
            <ul>
                <li><a href="game.html">Play</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="index.html#how-to-play">How to Play</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
        </div>
        <div>
            <p><b>COMPANY</b></p>
            <ul>
                <li>&copy; 2026 WAM!. All rights reserved.</li>
                <a href="https://github.com/Cly087/Game-Website_WhacAMole">GitHub Link</a>
            </ul>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>

</html>
