<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAM! - Play Game</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <!-- NAVIGATION BAR -->
    <nav>
        <div>
            <a href="index.html">Home</a>
            <a href="game.html">Play Game</a>
            <a href="leaderboard.html">Leaderboard</a>
        </div>
        <div class="nav-auth">
            <a href="login.html" id="login-btn">Log In</a>
            <a href="register.html" id="register-btn">Sign Up</a>
            <button id="logout-btn" class="btn" onclick="authSession.logout()">Log Out</button>
        </div>
    </nav>

    <!-- GAME CANVAS -->
    <main class="game">
        <p id="score" class="flex-center">Score: <span id="scoreVal">0</span></p>
        <p id="timer" class="flex-center">Time Left: <span id="timerVal">0</span></p>
        <canvas id="gameCanvas" width="256" height="192"></canvas>
        
        <!-- Game Over Modal Overlay -->
        <div id="gameOverModal" class="flex-center">
            <div class="modal-content">
                <h2>Time's Up!</h2>
                <p>Final Score: <strong id="finalScoreVal">0</strong></p>
                <button id="restartBtn" class="btn">Play Again</button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div>
            <p><b>ACCOUNT</b></p>
            <ul>
                <li><a href="login.html">Log In</a></li>
                <li><a href="register.html">Sign Up</a></li>
            </ul>
        </div>
        <div>
            <p><b>GAME</b></p>
            <ul>
                <li><a href="game.html">Play</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="index.html#how-to-play">How to Play</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
        </div>
        <div>
            <p><b>COMPANY</b></p>
            <p>&copy; 2026 WAM!. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth/auth_session.js"></script>
    <script src="../js/game/main.js" type="module"></script>
</body>

</html>
