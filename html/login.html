<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - WAM!</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <!-- NAVIGATION BAR -->
    <nav>
        <div>
            <a href="index.html">Home</a>
            <a href="game.html">Play Game</a>
            <a href="leaderboard.html">Leaderboard</a>
        </div>
        <div class="nav-auth">
            <a href="login.html" id="login-btn">Log In</a>
            <a href="register.html" id="register-btn">Sign Up</a>
            <a href="" id="logout-btn" onclick="authSession.logout()">Log Out</a>
        </div>
    </nav>

    <!-- LOGIN -->
    <main class="auth flex-center">
        <div>
            <h1 id="login-h1">Log In</h1>
            <div class="form">
                <!-- Email -->
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Email">
                <p id="email-error"></p>

                <!-- Password -->
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password">
                <p id="password-error"></p>

                <button class="btn" onclick="userLogin.login()">Log In</button>
            </div>
            <p>New here? <a href="register.html">Click to register.</a></p>
            <p id="login-error"></p>
            <p id="result"></p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div>
            <p><b>ACCOUNT</b></p>
            <ul>
                <li><a href="login.html">Log In</a></li>
                <li><a href="register.html">Sign Up</a></li>
            </ul>
        </div>
        <div>
            <p><b>GAME</b></p>
            <ul>
                <li><a href="game.html">Play</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="index.html#how-to-play">How to Play</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
        </div>
        <div>
            <p><b>COMPANY</b></p>
            <ul>
                <li>&copy; 2026 WAM!. All rights reserved.</li>
            </ul>
        </div>
    </footer>

    <script src="../js/auth.js"></script>
</body>

</html>
